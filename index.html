<!DOCTYPE html>
<html>

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>
    Wellness Carnival 2026 · Now Serving
  </title>


  <style>

    :root {

      --blue:
        #0166FF;

      --blue-dark:
        #0B43A5;

      --ink:
        #142033;

      --muted:
        #667085;

      --faint:
        #98A2B3;

      --bg:
        #F5F7FA;

      --white:
        #FFFFFF;

      --border:
        #E2E7EE;

      --green:
        #16834C;

      --green-bg:
        #EAF8F0;

      --orange:
        #A96500;

      --orange-bg:
        #FFF5E5;

      --shadow:
        0 14px 40px
        rgba(
          20,
          32,
          51,
          .07
        );

    }


    * {
      box-sizing:
        border-box;
    }


    html,
    body {

      width:
        100%;

      min-height:
        100%;

      margin:
        0;

    }


    body {

      background:
        var(--bg);

      color:
        var(--ink);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing:
        antialiased;

      overflow-x:
        hidden;

    }


    /* ======================================================
       HEADER
       ====================================================== */

    .topbar {

      min-height:
        92px;

      padding:
        18px 34px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      background:
        rgba(
          255,
          255,
          255,
          .96
        );

      border-bottom:
        1px solid
        var(--border);

      backdrop-filter:
        blur(18px);

    }


    .brand {

      display:
        flex;

      align-items:
        center;

      gap:
        15px;

      min-width:
        0;

    }


    .brand-logo {

      width:
        auto;

      height:
        48px;

      object-fit:
        contain;

    }


    .brand-title {

      font-size:
        21px;

      font-weight:
        700;

      letter-spacing:
        -.025em;

    }


    .brand-subtitle {

      margin-top:
        3px;

      color:
        var(--muted);

      font-size:
        12px;

    }


    .header-right {

      display:
        flex;

      align-items:
        center;

      gap:
        16px;

    }


    .live-pill {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      padding:
        9px 13px;

      border:
        1px solid
        #CBEAD9;

      border-radius:
        999px;

      background:
        var(--green-bg);

      color:
        var(--green);

      font-size:
        11px;

      font-weight:
        700;

      text-transform:
        uppercase;

      letter-spacing:
        .07em;

    }


    .live-dot {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        var(--green);

      box-shadow:
        0 0 0
        4px
        rgba(
          22,
          131,
          76,
          .10
        );

    }


    .clock {

      text-align:
        right;

    }


    .clock-time {

      font-size:
        18px;

      font-weight:
        700;

      letter-spacing:
        -.02em;

    }


    .clock-date {

      margin-top:
        2px;

      color:
        var(--muted);

      font-size:
        10px;

    }


    /* ======================================================
       MAIN
       ====================================================== */

    .page {

      width:
        min(
          1800px,
          calc(
            100% -
            64px
          )
        );

      margin:
        0 auto;

      padding:
        30px 0 25px;

    }


    .intro {

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        space-between;

      gap:
        20px;

      margin-bottom:
        22px;

    }


    .intro-eyebrow {

      color:
        var(--blue);

      font-size:
        11px;

      font-weight:
        700;

      text-transform:
        uppercase;

      letter-spacing:
        .12em;

    }


    .intro-title {

      margin-top:
        5px;

      font-size:
        32px;

      line-height:
        1.1;

      font-weight:
        700;

      letter-spacing:
        -.04em;

    }


    .intro-date {

      color:
        var(--muted);

      font-size:
        13px;

      text-align:
        right;

    }


    /* ======================================================
       SERVICE GRID
       ====================================================== */

    .service-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap:
        16px;

    }


    .service-card {

  min-height:
    265px;

  padding:
    20px;

  display:
    flex;

  flex-direction:
    column;

  background:
    var(--white);

  border:
    1px solid
    var(--border);

  border-radius:
    18px;

  box-shadow:
    var(--shadow);

}


.service-top {

  display:
    flex;

  align-items:
    flex-start;

  justify-content:
    space-between;

  gap:
    12px;

}


.service-name {

  font-size:
    17px;

  line-height:
    1.3;

  font-weight:
    700;

  letter-spacing:
    -.02em;

}


.service-location {

  margin-top:
    5px;

  color:
    var(--muted);

  font-size:
    10px;

}


.capacity-pill {

  flex:
    none;

  padding:
    6px 9px;

  border-radius:
    999px;

  background:
    #F5F7FA;

  color:
    var(--muted);

  font-size:
    9px;

  font-weight:
    600;

  white-space:
    nowrap;

}


.serving-label {

  margin-top:
    18px;

  color:
    var(--blue);

  font-size:
    9px;

  font-weight:
    700;

  text-transform:
    uppercase;

  letter-spacing:
    .10em;

}


.serving-list {

  min-height:
    70px;

  margin-top:
    8px;

  display:
    grid;

  grid-template-columns:
    repeat(
      3,
      minmax(
        0,
        1fr
      )
    );

  gap:
    7px;

  align-content:
    start;

}


.person-chip {

  min-width:
    0;

  min-height:
    38px;

  padding:
    8px 9px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    flex-start;

  gap:
    7px;

  border:
    1px solid
    #C9DCFB;

  border-radius:
    10px;

  background:
    #F3F7FF;

  color:
    #174EA6;

  font-size:
    12px;

  line-height:
    1.15;

  font-weight:
    700;

  overflow:
    hidden;

}


.person-number {

  flex:
    none;

  width:
    20px;

  height:
    20px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    6px;

  background:
    #DDEAFF;

  color:
    #174EA6;

  font-size:
    9px;

  font-weight:
    700;

}


.person-name {

  min-width:
    0;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;

}


.empty-serving {

  grid-column:
    1 / -1;

  padding:
    13px 0;

  color:
    var(--faint);

  font-size:
    12px;

}


.next-section {

  margin-top:
    12px;

  padding-top:
    12px;

  border-top:
    1px solid
    #EEF1F5;

}


.next-heading {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    10px;

}


.next-heading-label {

  color:
    var(--muted);

  font-size:
    8px;

  font-weight:
    700;

  text-transform:
    uppercase;

  letter-spacing:
    .09em;

}


.next-heading-count {

  color:
    var(--faint);

  font-size:
    8px;

  font-weight:
    600;

}


.next-list {

  margin-top:
    7px;

  display:
    grid;

  grid-template-columns:
    repeat(
      2,
      minmax(
        0,
        1fr
      )
    );

  gap:
    6px;

}


.next-person {

  min-width:
    0;

  padding:
    7px 8px;

  display:
    flex;

  align-items:
    center;

  gap:
    7px;

  border:
    1px solid
    #EEF1F5;

  border-radius:
    9px;

  background:
    #FAFBFC;

}


.next-number {

  flex:
    none;

  width:
    18px;

  height:
    18px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    5px;

  background:
    #F0F2F5;

  color:
    var(--muted);

  font-size:
    8px;

  font-weight:
    700;

}


.next-person-content {

  min-width:
    0;

}


.next-person-name {

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;

  font-size:
    10px;

  line-height:
    1.2;

  font-weight:
    600;

}


.next-person-time {

  margin-top:
    2px;

  color:
    var(--muted);

  font-size:
    8px;

}


.next-empty {

  padding:
    5px 0;

  color:
    var(--faint);

  font-size:
    10px;

}


.service-bottom {

  margin-top:
    auto;

  padding-top:
    9px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    flex-end;

  border-top:
    1px solid
    #EEF1F5;

}


.waiting-block {

  flex:
    none;

  text-align:
    right;

}


.waiting-number {

  font-size:
    18px;

  line-height:
    1;

  font-weight:
    700;

  letter-spacing:
    -.03em;

}


.waiting-label {

  margin-top:
    3px;

  color:
    var(--muted);

  font-size:
    7px;

  text-transform:
    uppercase;

  letter-spacing:
    .07em;

}


.additional-called {

  display:
    none;

}


    /* ======================================================
       EMPTY / ERROR
       ====================================================== */

    .state-card {

      padding:
        60px 25px;

      background:
        var(--white);

      border:
        1px solid
        var(--border);

      border-radius:
        18px;

      text-align:
        center;

    }


    .state-title {

      font-size:
        19px;

      font-weight:
        700;

    }


    .state-copy {

      max-width:
        500px;

      margin:
        8px auto 0;

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.55;

    }


    /* ======================================================
       FOOTER
       ====================================================== */

    .footer {

      margin-top:
        18px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        15px;

      color:
        var(--muted);

      font-size:
        9px;

    }


    .footer-left {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

    }


    .refresh-dot {

      width:
        5px;

      height:
        5px;

      border-radius:
        50%;

      background:
        var(--green);

    }


    /* ======================================================
       RESPONSIVE
       ====================================================== */

    @media (
      max-width: 1350px
    ) {

      .service-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );

      }

    }


    @media (
      max-width: 800px
    ) {

      .topbar {

        padding:
          15px 18px;

      }


      .brand-logo {

        height:
          38px;

      }


      .brand-title {

        font-size:
          16px;

      }


      .brand-subtitle {

        display:
          none;

      }


      .clock {

        display:
          none;

      }


      .page {

        width:
          calc(
            100% -
            30px
          );

        padding-top:
          20px;

      }


      .intro {

        align-items:
          flex-start;

        flex-direction:
          column;

      }


      .intro-date {

        text-align:
          left;

      }


      .service-grid {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>


<body>


  <!-- ======================================================
       HEADER
       ====================================================== -->

  <header class="topbar">

    <div class="brand">

      <img
        id="logo"
        class="brand-logo"
        alt="YPG India"
      >

      <div>

        <div
          id="brandTitle"
          class="brand-title">
          Wellness Carnival 2026
        </div>

        <div class="brand-subtitle">
          YPG India · Motorola Solutions
        </div>

      </div>

    </div>


    <div class="header-right">

      <div class="live-pill">

        <span class="live-dot"></span>

        Live

      </div>


      <div class="clock">

        <div
          id="clockTime"
          class="clock-time">
          --:--
        </div>

        <div
          id="clockDate"
          class="clock-date">
          --
        </div>

      </div>

    </div>

  </header>


  <!-- ======================================================
       PAGE
       ====================================================== -->

  <main class="page">


    <section class="intro">

      <div>

        <div class="intro-eyebrow">
          YPG India
        </div>

        <div class="intro-title">
          Now Serving
        </div>

      </div>


      <div
        id="eventDate"
        class="intro-date">
        Loading event date...
      </div>

    </section>


    <section
      id="displayContent"
      class="service-grid">
    </section>


    <footer class="footer">

      <div class="footer-left">

        <span class="refresh-dot"></span>

        <span>
          Live display · updates automatically
        </span>

      </div>


      <div
        id="updatedText">
        Connecting...
      </div>

    </footer>

  </main>


<script>

  const REFRESH_INTERVAL =
    5000;


  /*
   * GitHub Pages public display feed.
   * index.html and display.json live in the same repository root.
   */
  const DATA_URL =
    './display.json';


  const PUBLIC_LOGO_URL =
    'https://www.image2url.com/r2/default/files/1789826520122-fba4a533-46aa-45a1-b6a8-2a070b2b7a63.png';


  let refreshTimer =
    null;


  let clockTimer =
    null;


  document.addEventListener(
    'DOMContentLoaded',
    () => {

      updateClock();

      clockTimer =
        setInterval(
          updateClock,
          1000
        );

      loadDisplay(
        true
      );

    }
  );


  function loadDisplay(
    initial
  ) {

    if (
      initial
    ) {

      document.getElementById(
        'displayContent'
      ).innerHTML = `

        <div
          class="state-card"
          style="
            grid-column:
              1 / -1;
          ">

          <div class="state-title">
            Connecting to the live display...
          </div>

          <div class="state-copy">
            Please wait while the Wellness Carnival
            status is loaded.
          </div>

        </div>

      `;

    }


    fetch(
      `${DATA_URL}?t=${Date.now()}`,
      {
        method: 'GET',
        cache: 'no-store',
        headers: {
          'Accept': 'application/json'
        }
      }
    )
      .then(
        response => {

          if (!response.ok) {
            throw new Error(
              `Display feed returned ${response.status}`
            );
          }

          return response.json();
        }
      )
      .then(
        data => {

          renderDisplay(data);

          document.getElementById(
            'updatedText'
          ).textContent =
            data && data.updatedAt
              ? `Updated ${new Date(data.updatedAt).toLocaleTimeString('en-IN', {
                  hour: 'numeric',
                  minute: '2-digit',
                  second: '2-digit'
                })}`
              : 'Live';
        }
      )
      .catch(
        error => {
          showDisplayError(error);
        }
      );


    window.clearTimeout(
      refreshTimer
    );


    refreshTimer =
      window.setTimeout(
        () => {

          loadDisplay(
            false
          );

        },
        REFRESH_INTERVAL
      );
  }


  function renderDisplay(
    data
  ) {

    if (
      !data ||
      !data.success
    ) {

      showDisplayError({

        message:
          'The display data could not be loaded.'

      });

      return;
    }


    document.getElementById(
      'logo'
    ).src =
      PUBLIC_LOGO_URL;


    document.getElementById(
      'brandTitle'
    ).textContent =
      data.event.name ||
      'Wellness Carnival 2026';


    document.getElementById(
      'eventDate'
    ).textContent =
      data.event.dateLabel;


    const services =
      data.services ||
      [];


    const container =
      document.getElementById(
        'displayContent'
      );


    if (
      !services.length
    ) {

      container.innerHTML = `

        <div
          class="state-card"
          style="
            grid-column:
              1 / -1;
          ">

          <div class="state-title">
            No screenings configured
          </div>

          <div class="state-copy">
            No active screening services are configured
            for this event.
          </div>

        </div>

      `;

      updateUpdatedTime(
        data.updatedAt
      );

      return;
    }


    container.innerHTML =
      services
        .map(
          service =>
            renderServiceCard(
              service
            )
        )
        .join('');


    updateUpdatedTime(
      data.updatedAt
    );
  }


  function renderServiceCard(
  service
) {

  const nowServing =
    service.nowServing ||
    [];


  const nextPeople =
  (service.nextPeople || [])
    .slice(0, 2);


  const waitingCount =
    Number(
      service.waitingCount
    ) || 0;


  const displayCapacity =
    Math.max(
      1,
      Number(
        service.displayCapacity
      ) || 1
    );


  const location =
    service.location ||
    {};


  const locationParts =
    [
      location.name,
      location.floor
    ]
      .filter(
        Boolean
      );


  const currentTimeLabel =
    nowServing.length
      ? formatTime(
          nowServing[0].startTime
        )
      : '';


  const currentPeople =
    nowServing
      .map(
        (
          person,
          index
        ) => `

          <div
            class="person-chip">

            <span
              class="person-number">

              ${
                String(
                  index + 1
                ).padStart(
                  2,
                  '0'
                )
              }

            </span>

            <span
              class="person-name">

              ${escapeHtml(
                person.displayName
              )}

            </span>

          </div>

        `
      )
      .join('');


  const nextPeopleHtml =
    nextPeople
      .map(
        (
          person,
          index
        ) => {

          const displayNumber =
            nowServing.length +
            index +
            1;


          return `

            <div
              class="next-person">

              <span
                class="next-number">

                ${
                  String(
                    displayNumber
                  ).padStart(
                    2,
                    '0'
                  )
                }

              </span>


              <div
                class="next-person-content">

                <div
                  class="next-person-name">

                  ${escapeHtml(
                    person.displayName
                  )}

                </div>


                <div
                  class="next-person-time">

                  ${formatTime(
                    person.startTime
                  )}

                </div>

              </div>

            </div>

          `;

        }
      )
      .join('');


  return `

    <article
      class="service-card">


      <!-- SERVICE HEADER -->
      <div
        class="service-top">


        <div>

          <div
            class="service-name">

            ${escapeHtml(
              service.serviceName
            )}

          </div>


          <div
            class="service-location">

            ${escapeHtml(
              locationParts.length
                ? locationParts.join(
                    ' · '
                  )
                : 'Wellness Screening Area'
            )}

          </div>

        </div>


        <div
          class="capacity-pill">

          ${
            displayCapacity === 1
              ? '1 serving'
              : `${displayCapacity} serving capacity`
          }

        </div>

      </div>


      <!-- CURRENT -->
      <div
        class="serving-label">

        ${
          nowServing.length
            ? (
                currentTimeLabel
                  ? `Current · ${currentTimeLabel}`
                  : 'Current'
              )
            : 'Current'

        }

      </div>


      <div
        class="serving-list">

        ${
          nowServing.length
            ? currentPeople
            : `

                <div
                  class="empty-serving">

                  ${
                    nextPeople.length
                      ? 'No screening in progress'
                      : 'No one in the queue'
                  }

                </div>

              `
        }

      </div>


      <!-- NEXT -->
      <div
        class="next-section">


        <div
          class="next-heading">

          <div
            class="next-heading-label">

            Next up

          </div>


          <div
            class="next-heading-count">

            ${
              nextPeople.length
                ? `${nextPeople.length} people`
                : 'Queue clear'
            }

          </div>

        </div>


        <div
          class="next-list">

          ${
            nextPeople.length
              ? nextPeopleHtml
              : `

                  <div
                    class="next-empty"
                    style="
                      grid-column:
                        1 / -1;
                    ">

                    No one waiting

                  </div>

                `
          }

        </div>

      </div>


      <!-- QUEUE COUNT -->
      <div
        class="service-bottom">


        <div
          class="waiting-block">

          <div
            class="waiting-number">

            ${waitingCount}

          </div>

          <div
            class="waiting-label">

            waiting after current

          </div>

        </div>

      </div>


    </article>

  `;
}


  function showDisplayError(
    error
  ) {

    const message =
      error &&
      error.message
        ? error.message
        : 'Unable to connect to the Now Serving display.';


    const container =
      document.getElementById(
        'displayContent'
      );


    if (!container.innerHTML.trim()) {

      container.innerHTML = `

        <div
          class="state-card"
          style="
            grid-column:
              1 / -1;
          ">

          <div class="state-title">
            Now Serving display unavailable
          </div>

          <div class="state-copy">
            ${escapeHtml(
              message
            )}
          </div>

        </div>

      `;

    }


    document.getElementById(
      'updatedText'
    ).textContent =
      'Connection error';
  }


  function updateUpdatedTime(
    timestamp
  ) {

    if (
      !timestamp
    ) {
      return;
    }


    const date =
      new Date(
        timestamp
      );


    if (
      isNaN(
        date.getTime()
      )
    ) {
      return;
    }


    document.getElementById(
      'updatedText'
    ).textContent =
      `Updated ${date.toLocaleTimeString(
        'en-IN',
        {
          hour:
            'numeric',

          minute:
            '2-digit',

          second:
            '2-digit'
        }
      )}`;
  }


  function updateClock() {

    const now =
      new Date();


    document.getElementById(
      'clockTime'
    ).textContent =
      new Intl.DateTimeFormat(
        'en-IN',
        {
          timeZone:
            'Asia/Kolkata',

          hour:
            'numeric',

          minute:
            '2-digit',

          second:
            '2-digit'
        }
      ).format(
        now
      );


    document.getElementById(
      'clockDate'
    ).textContent =
      new Intl.DateTimeFormat(
        'en-IN',
        {
          timeZone:
            'Asia/Kolkata',

          weekday:
            'short',

          day:
            'numeric',

          month:
            'short',

          year:
            'numeric'
        }
      ).format(
        now
      );
  }


  function formatTime(
    value
  ) {

    const match =
      String(
        value ||
        ''
      ).match(
        /^(\d{1,2}):(\d{2})/
      );


    if (
      !match
    ) {

      return value || '';
    }


    let hour =
      Number(
        match[1]
      );


    const minute =
      Number(
        match[2]
      );


    const suffix =
      hour >=
      12
        ? 'PM'
        : 'AM';


    hour =
      hour %
        12 ||
      12;


    return (
      `${hour}:` +
      `${String(
        minute
      ).padStart(
        2,
        '0'
      )} ${suffix}`
    );
  }


  function escapeHtml(
    value
  ) {

    return String(
      value ??
      ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );
  }

</script>
